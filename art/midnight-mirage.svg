<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Album artwork">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12121C"/>
      <stop offset="55%" stop-color="#12121C"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4D8D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF4D8D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="42%" r="68%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#base)"/>
  <g filter="url(#soft)">
    <ellipse cx="170" cy="150" rx="180" ry="160" fill="url(#glowA)"/>
    <ellipse cx="450" cy="450" rx="200" ry="170" fill="url(#glowB)"/>
  </g>

  <g>
    <circle cx="300" cy="300" r="80" fill="none" stroke="#7C5CFF" stroke-width="10" opacity="0.55"/>
    <circle cx="300" cy="300" r="124" fill="none" stroke="#FF4D8D" stroke-width="9" opacity="0.47000000000000003"/>
    <circle cx="300" cy="300" r="168" fill="none" stroke="#7C5CFF" stroke-width="8" opacity="0.39"/>
    <circle cx="300" cy="300" r="212" fill="none" stroke="#FF4D8D" stroke-width="7" opacity="0.31000000000000005"/>
    <circle cx="300" cy="300" r="256" fill="none" stroke="#7C5CFF" stroke-width="6" opacity="0.23000000000000004"/>
  </g>

  <rect width="600" height="600" fill="url(#vig)"/>
  <rect width="600" height="600" filter="url(#grain)" opacity="0.07"/>
  <rect x="6" y="6" width="588" height="588" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" rx="4"/>
</svg>
