<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Album artwork">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12101A"/>
      <stop offset="55%" stop-color="#12101A"/>
      <stop offset="100%" stop-color="#9D4EDD" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9D4EDD" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#9D4EDD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB703" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFB703" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="42%" r="68%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#base)"/>
  <g filter="url(#soft)">
    <ellipse cx="170" cy="150" rx="180" ry="160" fill="url(#glowA)"/>
    <ellipse cx="450" cy="450" rx="200" ry="170" fill="url(#glowB)"/>
  </g>

  <g>
    <path d="M40 230 Q 170 150 300 230 T 560 230" fill="none" stroke="#9D4EDD" stroke-width="7" opacity="0.65" stroke-linecap="round"/>
    <path d="M40 285 Q 170 205 300 285 T 560 285" fill="none" stroke="#FFB703" stroke-width="7" opacity="0.53" stroke-linecap="round"/>
    <path d="M40 340 Q 170 260 300 340 T 560 340" fill="none" stroke="#9D4EDD" stroke-width="7" opacity="0.41000000000000003" stroke-linecap="round"/>
    <path d="M40 395 Q 170 315 300 395 T 560 395" fill="none" stroke="#FFB703" stroke-width="7" opacity="0.29000000000000004" stroke-linecap="round"/>
  </g>

  <rect width="600" height="600" fill="url(#vig)"/>
  <rect width="600" height="600" filter="url(#grain)" opacity="0.07"/>
  <rect x="6" y="6" width="588" height="588" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" rx="4"/>
</svg>
