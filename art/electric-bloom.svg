<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Album artwork">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181020"/>
      <stop offset="55%" stop-color="#181020"/>
      <stop offset="100%" stop-color="#FF7A59" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A59" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FF7A59" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD166" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFD166" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="42%" r="68%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#base)"/>
  <g filter="url(#soft)">
    <ellipse cx="170" cy="150" rx="180" ry="160" fill="url(#glowA)"/>
    <ellipse cx="450" cy="450" rx="200" ry="170" fill="url(#glowB)"/>
  </g>

  <g>
    <ellipse cx="300" cy="200" rx="52" ry="120" fill="#FF7A59" opacity="0.32" transform="rotate(0 300 300)"/>
    <ellipse cx="300" cy="200" rx="52" ry="120" fill="#FF7A59" opacity="0.32" transform="rotate(60 300 300)"/>
    <ellipse cx="300" cy="200" rx="52" ry="120" fill="#FF7A59" opacity="0.32" transform="rotate(120 300 300)"/>
    <ellipse cx="300" cy="200" rx="52" ry="120" fill="#FF7A59" opacity="0.32" transform="rotate(180 300 300)"/>
    <ellipse cx="300" cy="200" rx="52" ry="120" fill="#FF7A59" opacity="0.32" transform="rotate(240 300 300)"/>
    <ellipse cx="300" cy="200" rx="52" ry="120" fill="#FF7A59" opacity="0.32" transform="rotate(300 300 300)"/>
  </g>

  <rect width="600" height="600" fill="url(#vig)"/>
  <rect width="600" height="600" filter="url(#grain)" opacity="0.07"/>
  <rect x="6" y="6" width="588" height="588" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" rx="4"/>
</svg>
