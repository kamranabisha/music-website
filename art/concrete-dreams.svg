<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Album artwork">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0D15"/>
      <stop offset="55%" stop-color="#0D0D15"/>
      <stop offset="100%" stop-color="#B892FF" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B892FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#B892FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#48CAE4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#48CAE4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="42%" r="68%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#base)"/>
  <g filter="url(#soft)">
    <ellipse cx="170" cy="150" rx="180" ry="160" fill="url(#glowA)"/>
    <ellipse cx="450" cy="450" rx="200" ry="170" fill="url(#glowB)"/>
  </g>

  <g>
    <rect x="120" y="230" width="30" height="140" rx="15" fill="#B892FF" opacity="0.6"/>
    <rect x="182" y="255" width="30" height="90" rx="15" fill="#48CAE4" opacity="0.6"/>
    <rect x="244" y="195" width="30" height="210" rx="15" fill="#B892FF" opacity="0.6"/>
    <rect x="306" y="220" width="30" height="160" rx="15" fill="#48CAE4" opacity="0.6"/>
    <rect x="368" y="170" width="30" height="260" rx="15" fill="#B892FF" opacity="0.6"/>
    <rect x="430" y="240" width="30" height="120" rx="15" fill="#48CAE4" opacity="0.6"/>
    <rect x="492" y="205" width="30" height="190" rx="15" fill="#B892FF" opacity="0.6"/>
  </g>

  <rect width="600" height="600" fill="url(#vig)"/>
  <rect width="600" height="600" filter="url(#grain)" opacity="0.07"/>
  <rect x="6" y="6" width="588" height="588" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" rx="4"/>
</svg>
