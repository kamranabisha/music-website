<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Album artwork">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#100D16"/>
      <stop offset="55%" stop-color="#100D16"/>
      <stop offset="100%" stop-color="#F72585" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F72585" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F72585" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4CC9F0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="42%" r="68%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#base)"/>
  <g filter="url(#soft)">
    <ellipse cx="170" cy="150" rx="180" ry="160" fill="url(#glowA)"/>
    <ellipse cx="450" cy="450" rx="200" ry="170" fill="url(#glowB)"/>
  </g>

  <g>
    <line x1="90" y1="70" x2="90" y2="530" stroke="#F72585" stroke-width="2" opacity="0.35"/>
    <line x1="70" y1="90" x2="530" y2="90" stroke="#4CC9F0" stroke-width="2" opacity="0.28"/>
    <line x1="160" y1="70" x2="160" y2="530" stroke="#F72585" stroke-width="2" opacity="0.35"/>
    <line x1="70" y1="160" x2="530" y2="160" stroke="#4CC9F0" stroke-width="2" opacity="0.28"/>
    <line x1="230" y1="70" x2="230" y2="530" stroke="#F72585" stroke-width="2" opacity="0.35"/>
    <line x1="70" y1="230" x2="530" y2="230" stroke="#4CC9F0" stroke-width="2" opacity="0.28"/>
    <line x1="300" y1="70" x2="300" y2="530" stroke="#F72585" stroke-width="2" opacity="0.35"/>
    <line x1="70" y1="300" x2="530" y2="300" stroke="#4CC9F0" stroke-width="2" opacity="0.28"/>
    <line x1="370" y1="70" x2="370" y2="530" stroke="#F72585" stroke-width="2" opacity="0.35"/>
    <line x1="70" y1="370" x2="530" y2="370" stroke="#4CC9F0" stroke-width="2" opacity="0.28"/>
    <line x1="440" y1="70" x2="440" y2="530" stroke="#F72585" stroke-width="2" opacity="0.35"/>
    <line x1="70" y1="440" x2="530" y2="440" stroke="#4CC9F0" stroke-width="2" opacity="0.28"/>
    <line x1="510" y1="70" x2="510" y2="530" stroke="#F72585" stroke-width="2" opacity="0.35"/>
    <line x1="70" y1="510" x2="530" y2="510" stroke="#4CC9F0" stroke-width="2" opacity="0.28"/>
    <circle cx="300" cy="300" r="86" fill="#F72585" opacity="0.45"/>
  </g>

  <rect width="600" height="600" fill="url(#vig)"/>
  <rect width="600" height="600" filter="url(#grain)" opacity="0.07"/>
  <rect x="6" y="6" width="588" height="588" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" rx="4"/>
</svg>
